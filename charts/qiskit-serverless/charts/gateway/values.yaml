# Default values for gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
useCertManager: false

application:
  gatewayEnable: true
  schedulerEnable: true
  # Gunicorn configuration
  httpServer:
    serverModel: "main.wsgi:application"
    workers: 2
    threads: 1
    maxRequests: 1200
    jitter: 50
    timeout: 25
  debug: 0
  siteHost: "http://127.0.0.1:8000"
  rayHost: "http://ray:8265/"
  auth:
    mechanism: mock_token
    token:
      mock: awesome_token
    authMockproviderRegistry: "icr.io"
  superuser:
    enable: true
  maintenance: false
  ray:
    nodeImage: "icr.io/quantum-public/qiskit-serverless/ray-node:0.35.0"
    cpu: 2
    memory: 2
    gpu: 1
    replicas: 1
    minReplicas: 1
    maxReplicas: 4
    opensslImage: registry.access.redhat.com/ubi8/openssl:8.9-13
    kubectlImage: alpine/k8s:1.35.4
    scrapeWithPrometheus: true
    useTLS: true

  limits:
    maxJobsPerUser: 2
    maxActiveJobsPerUser: 50
    maxComputeResources: 4
    maxGpuResources: 1
    keepClusterOnComplete: False
    programTimeoutHours: 24
    argumentsSchemaMemoryLimitMb: 128
    # Seconds of CPU given to the forked child that validates job arguments against a function's JSON
    # Schema. The isolation also bounds that child on wall-clock time, at five times this budget, so
    # this is equally a bound on how long one request can hold a worker: 1 allows a 5 second deadline,
    # 5 allows 25. That deadline has to fit inside httpServer.timeout above with room left for the
    # rest of the request, because a deadline that reaches the timeout means gunicorn's arbiter kills
    # the worker at the moment the gateway would have answered 400, and takes every other request on
    # that worker with it (threads: 1 above). At the timeout of 25 set above, do not raise this past
    # 3. If a function's schema needs more than that, raise the timeout first.
    argumentsSchemaCpuLimitSeconds: 1
    # Largest request body the gateway accepts, in MB. Set here because Django's own default of
    # 2.5 MB is below one batch of encoded circuits (about 39 KB each). Over the limit the gateway
    # answers 413. When the ingress below is enabled, templates/ingress.yaml derives its
    # proxy-body-size annotation from this value; a deployment fronting the gateway some other way,
    # with an Istio ingress gateway for instance, has to bound the body there itself.
    #
    # This one is bounded by the pod, not by one request. Measured in a container: a body costs about
    # 3.2x its size in the worker holding it (50 MB -> 169 MB, 100 MB -> 319 MB), and every worker can
    # hold one at once, so the pod needs resources.limits.memory > workers x 3.2 x this value. Keeping
    # that under half the pod's memory leaves room for everything else the gateway does:
    #
    #   memory / workers | 2 workers | 5 workers | 10 workers
    #   -----------------|-----------|-----------|-----------
    #   2Gi              |   160 MB  |    64 MB  |    32 MB
    #   4Gi              |   320 MB  |   128 MB  |    64 MB
    #   8Gi              |   640 MB  |   256 MB  |   128 MB
    #
    # Past the pod's memory nothing answers 413: the kernel OOM-kills a worker, which was measured
    # (ten concurrent 200 MB bodies in 4Gi killed three workers with SIGKILL). Raise the memory limit
    # or lower the worker count first.
    maxRequestBodySizeMb: 50
    # Longest arguments accepted for a function that declares an arguments_schema, in MB, applied
    # before anything is forked. Below maxRequestBodySizeMb because validating costs more than
    # accepting: the child that validates grows its address space by about 1 MB per MB of encoded
    # circuits, or 8 MB per MB for an array of many tiny objects, against the margin above. So for a
    # batch of circuits it is usually that margin that refuses a caller first, at about 127 MB with
    # the default 128, and for dense shapes the CPU budget does it at about 6 MB. Clamped to 1-64 in
    # code. Over the limit the caller gets a 400 naming it.
    maxArgumentsLengthMb: 32
  qiskitRuntime:
    url: "https://cloud.ibm.com"
  runtimeApi:
    url: "https://quantum.cloud.ibm.com"
    cacheTtl: "1"
  allowedHosts: "*"
  trustedOrigins: "http://localhost"
  corsOrigins: "http://localhost"
  logsMaximumSize: "52428800" # 50Mb in bytes
  logFormat: json
  security:
    hstsSeconds: 0  # 0 means disabled
    hstsIncludeSubdomains: false
    hstsPreload: false
  eventStreams:
    enabled: false
    environment: ""
  # Optional IBM w3id SSO backoffice login. The provider base url is not
  # sensitive and lives here; credentials go in secrets.w3idSso (see below).
  w3idSso:
    enabled: false
    baseUrl: "https://test.login.w3.ibm.com"
  ibmCloudFidApiKey:
    enabled: false

tracing:
  enabled: false
  agentUrl: "http://otel-collector:4318/v1/traces"
  metricsPort: 8081
  ray:
    enabled: false
    local: false

cos:
  claimName: gateway-claim

ce:
  fleetsGatewayHost: "http://127.0.0.1:8000"
  defaultProjectName: ""
  defaultComputeProfile: "bx3d-24x120"
  fleetsDefaultImage: "private.icr.io/quantum-public/qiskit-serverless/fleet-node:0.35.0"
  fleetsDefaultMaxInstances: 1

secrets:
  secretKey:
    name: gateway-secret-key
    key: django-secret-key
  servicePsql:
    name: service-psql-binding
    key:
      databaseName: database-name
      databasePassword: database-password
      host: database-host
      port: database-port
      userName: user-name
    createExternalSecret: false
    secretRef: ""
    secretStoreName: qiskit-serverless
  superuser:
    name: gateway-superuser
    key:
      name: name
      password: password
      email: email
  w3idSso:
    name: ""
    secretRef: ""
    secretStoreName: qiskit-serverless
  kafka:
    name: ""
    secretRef: ""
    secretStoreName: qiskit-serverless
  ibmCloudFidApiKey:
    name: ""
    secretRef: ""
    secretStoreName: qiskit-serverless

image:
  repository: icr.io/quantum-public/qiskit-serverless/gateway
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

gateway:
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 100
#  fsGroupChangePolicy: "OnRootMismatch"

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: "3000m"
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "700Mi"
scheduler:
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8001"
  siteHost: "http://0.0.0.0:8001"
  port: 8001
  resources:
    limits:
      cpu: "1500m"
      memory: "270Mi"
    requests:
      cpu: "100m"
      memory: "180Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2

nodeSelector: {}

tolerations: []

affinity: {}
