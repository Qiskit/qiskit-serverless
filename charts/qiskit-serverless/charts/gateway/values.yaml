# Default values for gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
useCertManager: false

application:
  gatewayEnable: true
  schedulerEnable: true
  # Gunicorn configuration
  httpServer:
    serverModel: "main.wsgi:application"
    workers: 2
    threads: 1
    maxRequests: 1200
    jitter: 50
    timeout: 25
  debug: 0
  siteHost: "http://127.0.0.1:8000"
  rayHost: "http://ray:8265/"
  auth:
    mechanism: mock_token
    token:
      mock: awesome_token
    authMockproviderRegistry: "icr.io"
  superuser:
    enable: true
  maintenance: false
  ray:
    nodeImage: "icr.io/quantum-public/qiskit-serverless/ray-node:0.35.0"
    cpu: 2
    memory: 2
    gpu: 1
    replicas: 1
    minReplicas: 1
    maxReplicas: 4
    opensslImage: registry.access.redhat.com/ubi8/openssl:8.9-13
    kubectlImage: alpine/k8s:1.35.4
    scrapeWithPrometheus: true
    useTLS: true

  limits:
    maxJobsPerUser: 2
    maxActiveJobsPerUser: 50
    maxComputeResources: 4
    maxGpuResources: 1
    keepClusterOnComplete: False
    programTimeoutHours: 24
    # Request size limits. Sized against this pod's resources.limits.memory and httpServer.workers
    # above, not one request at a time: a body costs about 3.2x its size in the worker holding it, and
    # every worker can hold one at once. Raising any of these without checking that is how a worker
    # gets OOM-killed instead of the gateway answering 413. specs/ARGUMENTS_LIMIT.md has the table of
    # what fits per pod memory and worker count, the measurements behind it, and how to repeat them.
    #
    # Memory margin (MB) and CPU seconds for the child that validates arguments against a schema.
    # Clamped in code to 64-256 and 1-5. The CPU budget also caps how long one request can hold a
    # worker, at five times its value, which has to stay under httpServer.timeout above.
    argumentsSchemaMemoryLimitMb: 128
    argumentsSchemaCpuLimitSeconds: 1
    # Largest request body accepted, in MB, with or without a schema. Over it, a 413. When the ingress
    # below is enabled, templates/ingress.yaml derives its proxy-body-size annotation from this value;
    # a deployment fronting the gateway another way, with Istio for instance, bounds the body there.
    maxRequestBodySizeMb: 50
    # Longest arguments validated against a schema, in MB. Over it, a 400. Clamped in code to 1-64.
    maxArgumentsLengthMb: 32
  qiskitRuntime:
    url: "https://cloud.ibm.com"
  runtimeApi:
    url: "https://quantum.cloud.ibm.com"
    cacheTtl: "1"
  allowedHosts: "*"
  trustedOrigins: "http://localhost"
  corsOrigins: "http://localhost"
  logsMaximumSize: "52428800" # 50Mb in bytes
  logFormat: json
  security:
    hstsSeconds: 0  # 0 means disabled
    hstsIncludeSubdomains: false
    hstsPreload: false
  eventStreams:
    enabled: false
    environment: ""
  # Optional IBM w3id SSO backoffice login. The provider base url is not
  # sensitive and lives here; credentials go in secrets.w3idSso (see below).
  w3idSso:
    enabled: false
    baseUrl: "https://test.login.w3.ibm.com"
  ibmCloudFidApiKey:
    enabled: false

tracing:
  enabled: false
  agentUrl: "http://otel-collector:4318/v1/traces"
  metricsPort: 8081
  ray:
    enabled: false
    local: false

cos:
  claimName: gateway-claim

ce:
  fleetsGatewayHost: "http://127.0.0.1:8000"
  defaultProjectName: ""
  defaultComputeProfile: "bx3d-24x120"
  fleetsDefaultImage: "private.icr.io/quantum-public/qiskit-serverless/fleet-node:0.35.0"
  fleetsDefaultMaxInstances: 1

secrets:
  secretKey:
    name: gateway-secret-key
    key: django-secret-key
  servicePsql:
    name: service-psql-binding
    key:
      databaseName: database-name
      databasePassword: database-password
      host: database-host
      port: database-port
      userName: user-name
    createExternalSecret: false
    secretRef: ""
    secretStoreName: qiskit-serverless
  superuser:
    name: gateway-superuser
    key:
      name: name
      password: password
      email: email
  w3idSso:
    name: ""
    secretRef: ""
    secretStoreName: qiskit-serverless
  kafka:
    name: ""
    secretRef: ""
    secretStoreName: qiskit-serverless
  ibmCloudFidApiKey:
    name: ""
    secretRef: ""
    secretStoreName: qiskit-serverless

image:
  repository: icr.io/quantum-public/qiskit-serverless/gateway
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

gateway:
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 100
#  fsGroupChangePolicy: "OnRootMismatch"

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: "3000m"
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "700Mi"
scheduler:
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8001"
  siteHost: "http://0.0.0.0:8001"
  port: 8001
  resources:
    limits:
      cpu: "1500m"
      memory: "270Mi"
    requests:
      cpu: "100m"
      memory: "180Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2

nodeSelector: {}

tolerations: []

affinity: {}
