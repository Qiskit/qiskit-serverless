---
features:
  - |
    A Code Engine project can now be dedicated to one or more Qiskit Function providers
    (for example, ``mockprovider`` and ``testprovider`` can share one project, or each 
    have their own), set from Django admin. A Fleets function belonging to a provider is 
    assigned that provider's project, and a function with no provider keeps using the 
    shared default project.
upgrade:
  - |
    A Fleets function that belongs to a provider now requires a Code Engine project
    dedicated to that provider. It is no longer given the default project as a fallback,
    so uploading or running such a function fails until a project is assigned to that
    provider in Django admin.
  - |
    Uploading or running a Fleets function whose Code Engine project has been deactivated
    now fails with a clear message, instead of silently using it.
