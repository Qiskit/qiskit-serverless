---
features:
  - |
    ``QiskitFunction`` accepts an ``arguments_schema``: a JSON Schema describing the
    arguments the function expects. Declare it at upload time and the gateway validates
    every run against it, rejecting invalid arguments before a job is created::

        function = QiskitFunction(
            title="my-function",
            entrypoint="main.py",
            working_dir="./src",
            arguments_schema={
                "type": "object",
                "required": ["shots"],
                "properties": {"shots": {"type": "integer"}},
            },
        )
        runnable = client.upload(function)

    ``RunnableQiskitFunction.validate_arguments(arguments)`` checks arguments against
    that schema without submitting a run, so you can validate inputs up front::

        runnable.validate_arguments({"shots": 1024})

    Functions read back with ``client.function(...)`` or ``client.functions()`` now
    include ``arguments_schema``, so you can inspect the arguments a function expects
    even when you did not upload it yourself.
upgrade:
  - |
    ``QiskitFunction.schema`` has been renamed to ``arguments_schema`` and its type
    changed from ``Optional[str]`` to ``Optional[Dict[str, Any]]``. The old field was
    never read by the client or sent to the gateway, so there is no deprecation path.
    Pass a plain dict rather than a JSON string.
  - |
    The unused ``validate`` field has been removed from ``QiskitFunction``. It gated a
    client-side validation hook that was never implemented and always reported success,
    so passing ``validate=False`` had no effect. Argument validation now happens on the
    gateway against ``arguments_schema``.
