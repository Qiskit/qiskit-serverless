---
features:
  - |
    The ``scheduler_operation_duration_seconds`` histogram has new operations that
    time the database side of ``UpdateFleetsJobsStatuses``: one per job status
    transition (``job_transition_queued_to_pending``, ``job_transition_pending_to_running``
    and ``job_transition_to_terminal``), ``job_in_progress_event`` (the progress event
    sent for a job that is still running, not a transition, and never for a filler job)
    and ``job_last_event_query``, the query that looks for the last event of a job.
    Together with ``fleet_status_read`` they show how much of the task is database and how
    much is Cloud Object Storage. ``job_transition_to_terminal`` covers a job that
    succeeds, fails or is stopped by ``to_stopped``, but not the status written by ``stop()``
    (the stop of a job by a user or by the timeout), which also cancels the fleet in Code
    Engine. The gateway records nothing.
