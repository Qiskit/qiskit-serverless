---
features:
  - |
    The ``scheduler_operation_duration_seconds`` histogram has new operations that time
    the job status transitions the scheduler makes, wherever they are called from:
    ``job_transition_queued_to_pending``, ``job_transition_pending_to_running`` and
    ``job_transition_to_terminal``. The last one also counts the jobs that end because
    they are filler jobs or because their fleet is blocked, not only the ones that
    ``UpdateFleetsJobsStatuses`` finishes. ``job_transition_pending_to_running`` includes
    the ``job_started`` event sent right after the transaction, so it is not database time
    alone. Other new operations are ``job_in_progress_event`` (the progress event sent for
    a job that is still running, not a transition, and never for a filler job) and
    ``job_last_event_query``, the query that looks for the last event of a job. Together
    with ``fleet_status_read`` they show how much of ``UpdateFleetsJobsStatuses`` is
    database and how much is Cloud Object Storage. A transition rejected because the job
    was already moved by someone else (a user stopped it) is recorded with the status
    ``rejected`` and not ``error``. ``job_transition_to_terminal`` covers a job that
    succeeds, fails or is stopped by ``to_stopped``, but not the status written by ``stop()``
    (the stop of a job by a user or by the timeout), which also cancels the fleet in Code
    Engine. The gateway records nothing.
