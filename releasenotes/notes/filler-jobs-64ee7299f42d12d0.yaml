---
features:
  - |
    The scheduler can now keep a scarce Fleets compute profile busy with filler
    jobs. When fewer than ``scheduler.filler.slots`` jobs are running on the
    compute profile of the function named by ``scheduler.filler.function``, it
    starts filler jobs to make up the difference, and it stops them again in the
    same scheduler iteration that real jobs take the capacity. The feature is off until
    ``scheduler.filler.enabled`` is set to true, and all three values are dynamic
    configuration that can change without a redeploy. The user the filler jobs
    belong to comes from the ``FILLER_AUTHOR_USERNAME`` environment variable, and
    the feature stays off until that user exists.
  - |
    The balancer counts its own actions on ``scheduler_filler_jobs_created_total``,
    labelled by whether the submit reached PENDING, and on
    ``scheduler_filler_jobs_stopped_total``. Together they say how often filler jobs
    are being cycled.
  - |
    Two gauges say whether the feature is doing its job at all, which is what to
    alert on. ``scheduler_filler_profile_slots`` is the configured target, and
    ``scheduler_filler_profile_jobs`` is how many jobs are actually holding the
    protected compute profile, split by a ``kind`` label into ``real`` and
    ``filler``. Their sum staying below the target for several minutes means the
    protected capacity is sitting idle, whatever the reason. Both go quiet while the
    feature is off: the target reads zero and the occupancy series are removed, so
    nothing reports a measurement that was never taken. Neither carries the profile
    id as a label, because only one profile is protected at a time and a label that
    changes when an operator re-points the filler program would leave stale series
    behind; the balancer's log line names the profile.
upgrade:
  - |
    Filler jobs never emit billing events.
  - |
    Turning on maintenance mode now stops any running filler job, as well as
    preventing new ones. This frees the capacity so the platform can be drained,
    and the filler jobs come back within a second of maintenance ending. Note that
    it means switching on maintenance cancels the filler jobs occupying the
    protected compute profile.
  - |
    Filler jobs count against ``LIMITS_MAX_FLEETS``, so enabling ``N`` slots reduces
    the global Fleets budget by ``N``. This is negligible at the default of 1000,
    but not at a deployment that sets that limit low. A stopped filler job's Code
    Engine fleet is cancelled but never deleted, and filler jobs cycle far more
    often than real ones, so they accumulate cancelled fleets in the project faster
    than user jobs do.
  - |
    ``scheduler.filler.slots`` is honored as configured, with no upper bound, so a
    mistyped value does take that many slots out of ``LIMITS_MAX_FLEETS``. The
    balancer creates one filler job per scheduler iteration, so the configured number
    is reached over as many iterations, about one per second, rather than in one.
  - |
    Setting ``scheduler.filler.slots`` to zero, or to any value below it, means the
    same as ``scheduler.filler.enabled`` being false: nothing is created and every
    running filler job is stopped.
  - |
    Filler jobs are also stopped when they no longer match the configured filler
    function, not only when they no longer match its compute profile. Pointing
    ``scheduler.filler.function`` at another function therefore drains the jobs
    running the old one, and the balancer replaces them with jobs running the new
    one. That value takes either form: a ``provider/title`` name, which reads the
    same in every environment, or the function's id. Prefer the name, because it
    requires a provider function, and a provider function can be updated by anyone
    with write access to the provider. A personal function can only be named by id,
    and only its author can update it.
  - |
    To switch the feature off, disable the filler function or set
    ``scheduler.filler.slots`` to zero, but never delete the filler ``Program``
    row or deactivate its Code Engine project while filler jobs are running. In
    either case the balancer can no longer cancel the fleets it created for that
    program, and they keep running in Code Engine until an operator finds and
    cancels them by hand.
