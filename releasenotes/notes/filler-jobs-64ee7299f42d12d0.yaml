---
features:
  - |
    The scheduler can now keep a scarce Fleets compute profile busy with filler
    jobs. When fewer than ``scheduler.filler.slots`` jobs are running on the
    compute profile of the program named by ``scheduler.filler.program_id``, it
    starts filler jobs to make up the difference, and it stops them again in the
    same scheduler iteration that real jobs take the capacity. The feature is off until
    ``scheduler.filler.enabled`` is set to true, and all three values are dynamic
    configuration that can change without a redeploy. The user the filler jobs
    belong to comes from the ``FILLER_AUTHOR_USERNAME`` environment variable, and
    the feature stays off until that user exists.
  - |
    Filler jobs are reported on their own metrics: ``scheduler_filler_jobs_count``
    for how many are active, ``scheduler_filler_jobs_created_total`` and
    ``scheduler_filler_jobs_stopped_total`` for how often they are being cycled.
upgrade:
  - |
    Filler jobs are excluded from ``scheduler_job_status_count``,
    ``scheduler_jobs_terminal_total``, ``scheduler_job_execution_duration_seconds``,
    ``scheduler_queue_wait_seconds``, and from the job totals and the recent-jobs
    timeline on the admin dashboard, because they run continuously and
    would otherwise look like user demand. Dashboards or alerts that expect those
    series to include every job need the filler metrics added to them. Filler jobs
    also never emit billing events.
  - |
    Turning on maintenance mode now stops any running filler job, as well as
    preventing new ones. This frees the capacity so the platform can be drained,
    and the filler jobs come back within a second of maintenance ending. Note that
    it means switching on maintenance cancels the filler jobs occupying the
    protected compute profile.
  - |
    Filler jobs count against ``LIMITS_MAX_FLEETS``, so enabling ``N`` slots reduces
    the global Fleets budget by ``N``. This is negligible at the default of 1000,
    but not at a deployment that sets that limit low. A stopped filler job's Code
    Engine fleet is cancelled but never deleted, and filler jobs cycle far more
    often than real ones, so they accumulate cancelled fleets in the project faster
    than user jobs do.
  - |
    Two things can silently reduce the number of filler jobs running, both worth
    alerting on. The balancer stops creating filler jobs, and logs at ERROR, when
    three of them have ended by themselves within five minutes, because a filler
    program is meant to run until something needs its slot. And
    ``scheduler.filler.slots`` is capped in code at 16: a larger configured value
    is clamped down to that cap, with a warning logged, rather than honored.
  - |
    To switch the feature off, disable the filler function or set
    ``scheduler.filler.slots`` to zero, but never delete the filler ``Program``
    row or deactivate its Code Engine project while filler jobs are running. In
    either case the balancer can no longer cancel the fleets it created for that
    program, and they keep running in Code Engine until an operator finds and
    cancels them by hand.
