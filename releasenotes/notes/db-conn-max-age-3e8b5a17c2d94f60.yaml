---
upgrade:
  - |
    The gateway chart now reuses each database connection for up to 60
    seconds, instead of opening a new one for every request. Set
    ``application.database.connMaxAge`` to change it. ``0`` restores the old
    behaviour. Each gunicorn thread keeps one connection, so the gateway holds
    ``pods x workers x threads`` connections even when it is idle. The
    scheduler is not changed, and still opens a new connection on every loop.
fixes:
  - |
    A database connection that the network drops without a reply now fails
    after at most 30 seconds, and a connection attempt after 10 seconds,
    instead of hanging for many minutes.
