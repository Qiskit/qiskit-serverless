---
upgrade:
  - |
    The gateway now reuses each database connection for up to 60 seconds,
    instead of opening a new one for every request. Set
    ``application.database.connMaxAge`` in the gateway chart, or
    ``DATABASE_CONN_MAX_AGE``, to change it. ``0`` restores the old behaviour.
    Each gunicorn thread keeps one connection, so the gateway now holds
    ``pods x workers x threads`` connections even when it is idle.
