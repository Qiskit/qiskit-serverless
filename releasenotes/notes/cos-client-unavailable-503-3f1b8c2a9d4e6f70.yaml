---
fixes:
  - |
    A request that reads or writes a Code Engine Fleets job's files in COS now
    answers 503 "please retry" when Code Engine rate limits the gateway, answers
    a 5xx, or does not answer in time. It used to answer 500. This covers running
    a function, and reading its logs, result and files. Reading the COS HMAC
    secret from Code Engine now has a request timeout, so such a request no
    longer hangs.
