---
fixes:
  - |
    Running a Qiskit Function with a large batch of arguments no longer fails with
    ``500 Internal server error``. Django's default limit on the size of a request
    body is 2.5 MB, and ``djangorestframework`` 3.18.0 started applying it to JSON
    requests, which it had not done before. A batch of encoded circuits goes over
    that easily, since one 100 qubit, depth 100 circuit is about 39 KB of base64.
    The gateway now accepts a body of up to 50 MB, set through the new
    ``MAX_REQUEST_BODY_SIZE_MB`` setting.
  - |
    A request body over the limit is now reported as ``413 Request Entity Too
    Large`` naming the limit, instead of the ``500 Internal server error`` the
    endpoint decorator's generic handler produced.
  - |
    Raised the maximum length of the arguments validated against a function's
    ``arguments_schema`` from 1 MB to 32 MB. The old figure fitted about twenty
    five encoded circuits, which was below what callers send in one batch. The new
    one fits about eight hundred and still leaves the validation well inside the
    memory it is allowed: validating a batch of circuits grows the forked child by
    2.24 MB per MB of arguments, so 32 MB uses about 72 MB of the 128 MB margin.
upgrade:
  - |
    Both limits are bounded by the pod rather than by one request, so weigh them
    against ``gateway.resources`` and ``gateway.application.httpServer.workers``.
    A request body costs about 3.5 times its size in the worker holding it. At
    4 Gi with 5 workers, a 50 MB body leaves roughly 2.9 GB in use at full
    concurrency; 100 MB would reach 3.5 GB, and past the pod's memory the kernel
    OOM-kills a worker instead of the gateway answering 413.
  - |
    When the gateway ingress is enabled, the chart now derives its
    ``nginx.ingress.kubernetes.io/proxy-body-size`` annotation from
    ``gateway.application.limits.maxRequestBodySizeMb``, so the proxy and the
    gateway agree on the limit and changing it in one place changes both. A
    deployment that sets that annotation under ``gateway.ingress.annotations``
    keeps its own value. A deployment that fronts the gateway some other way has
    to bound the request body there itself.
