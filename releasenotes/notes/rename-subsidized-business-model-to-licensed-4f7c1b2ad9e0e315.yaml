---
features:
  - |
    Added ``LICENSED`` as the new name of the ``SUBSIDIZED`` business model. The
    Runtime API may still answer ``SUBSIDIZED`` for a function, and that value is
    still accepted, but it is turned into ``LICENSED`` as soon as it is read, so
    new jobs are always stored with the new name. Both names bill as ``licensed``,
    which is what the billing service already expected, so billing is unaffected.
upgrade:
  - |
    Jobs now report ``LICENSED`` in the ``business_model`` field, and ``SUBSIDIZED``
    is gone from every response, from the admin backoffice and from the billing
    events: new jobs are stored with the new name, and a job row still holding the
    old one is translated as it is read from the database. Existing rows are left
    untouched, a later release migrates them and drops the translation.
