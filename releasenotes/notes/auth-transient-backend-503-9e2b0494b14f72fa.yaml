---
fixes:
  - |
    A request whose authentication could not be completed because IBM Cloud was
    unreachable, timed out, or returned a server error now fails with ``HTTP 503``
    and a message asking the user to retry, instead of a ``401`` telling them to
    review their API key or CRN. Valid credentials and a valid CRN are no longer
    reported as invalid during an IBM Cloud outage; the ``401`` messages are kept
    only when IBM Cloud actually rejects the API key or the CRN.
