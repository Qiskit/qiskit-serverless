---
features:
  - |
    Added the ``ComputeProfile`` model, which maps a Code Engine compute profile
    identifier (for example ``24x120x1l40s``) to its CPU, memory and GPU
    allocation. Memory is recorded in GB. The table starts empty; profiles are
    created by operators through the admin backoffice.
  - |
    Added the ``FunctionSize`` model, which pairs a Qiskit Function with a size
    keyword and the ``ComputeProfile`` that size resolves to. A function may
    define at most one row per size keyword. Deleting a function removes its
    sizes; a compute profile still referenced by a size cannot be deleted.
  - |
    Added the ``default_size`` field to Qiskit Functions, naming the
    ``FunctionSize`` to use when a run request omits an explicit size. The field
    is optional, and a size assigned to it must belong to the same function.
upgrade:
  - |
    The ``default_compute_profile`` field has been removed from the Qiskit
    Function model definition. No code path read it, since the Fleets runner
    resolves its default from the ``DEFAULT_COMPUTE_PROFILE`` setting. This is
    the first step: the ``api_program.default_compute_profile`` column is left
    in the database, and a later release drops it.
