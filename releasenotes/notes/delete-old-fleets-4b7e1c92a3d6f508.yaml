---
features:
  - |
    The scheduler now deletes the Code Engine fleet of a terminal Fleets job once a retention
    window has passed, so a project does not reach its limit of 1000 fleets. The window keeps a
    fleet inspectable after the job row was last written, and it is two weeks. Both the feature and
    the window are dynamic config: ``scheduler.fleets.cleanup.enabled``, off by default, and
    ``scheduler.fleets.cleanup.retention_hours``, 336 by default.
  - |
    A project close to its fleet limit does not wait out the two-week window. Once it holds
    ``scheduler.fleets.cleanup.force_at_percent`` of ``scheduler.fleets.quota_per_project``, 80% of
    1000 by default, its oldest fleets are deleted until it is back under that number. Setting the
    percentage to 100 leaves the window as the only rule. Only terminal jobs are ever deleted,
    because deleting the fleet of a running job would kill it. So a project can stay over the
    threshold with every fleet still live, and the scheduler logs that at ERROR. A job with no
    recorded project counts against no project, and only the window deletes it.
  - |
    New ``scheduler_held_fleets`` metric, the fleets not yet deleted in each Code Engine
    project. A project holds at most 1000, so this is what an alert should watch. A fleet we keep
    failing to delete stays in the count, so the number never hides a leak. It is reported every
    scheduler loop, and also while the feature is disabled, so the backlog can be sized before the
    deletion is turned on.
upgrade:
  - |
    ``Job`` has a new ``fleet_deleted_at`` field, set once Code Engine accepted the delete so it is
    not tried again. Code Engine finishes the delete a minute or two later. A fleet the delete keeps
    failing on is never stamped: after three attempts the scheduler stops picking it so it cannot
    block the queue, logs it at ERROR, and retries it after a restart. It is read-only in the
    backoffice. Migration ``0074`` adds it together with a partial index on ``api_job``.
  - |
    The delete resolves its Code Engine project from the job's own ``ce_project_name``, so a
    program reassigned to another project after a job ran still has its fleet deleted in the
    project that created it. An inactive project is included, because an offboarded project
    still holds fleets.
  - |
    The scheduler now keeps one circuit breaker per dependency per region, where it kept one per
    region. COS and Code Engine get their own, because a Fleets submit needs both while a fleet
    delete needs only Code Engine. So a COS failure and a Code Engine failure no longer add up on
    one counter, and a working delete is read as evidence about Code Engine only. The Code Engine
    breaker is shared by the submit and the delete path, so a failure on either one pauses both.
    Five consecutive failures that a later try can fix still open a breaker for a minute, and both
    numbers stay dynamic config: ``scheduler.fleets.breaker_failures`` and
    ``scheduler.fleets.breaker_pause_seconds``.
  - |
    The cleanup waits out an unavailable Code Engine with that breaker instead of sleeping inside
    the scheduler loop. ``FleetHandler.delete_job`` used to sleep 60 seconds on a 429 and retry
    forever, which would have blocked every other scheduler task for a minute. It now raises the 429
    so the caller decides. A timeout or a 502 counts as a failure too, because a delete that may
    already have happened is free to repeat. The breaker counts one outcome per cleanup cycle.
