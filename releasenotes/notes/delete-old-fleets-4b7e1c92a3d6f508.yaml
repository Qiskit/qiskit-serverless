---
features:
  - |
    The scheduler now deletes the Code Engine fleet of a terminal Fleets job once a two-week
    retention window has passed, so a project does not reach its limit of 1000 fleets. The window
    keeps a fleet inspectable after the job finished. It is on from the first scheduler pod that
    boots, and because fleet deletion has never run before, the first cycles work through every
    fleet we still hold that is older than the window. A deleted fleet cannot be recovered for Code
    Engine support. Three things are dynamic config: ``scheduler.fleets.cleanup.enabled``, on by
    default, ``scheduler.fleets.cleanup.retention_hours``, 336, and
    ``scheduler.fleets.cleanup.max_deletes_per_cycle``, 20.
  - |
    A project close to its fleet limit does not wait out the window. Once it holds
    ``scheduler.fleets.cleanup.force_at_percent`` of ``scheduler.fleets.quota_per_project``, 80% of
    1000 by default, its oldest fleets are deleted until it is back under that number, and never
    more than it needs. A percentage outside 1 to 99 leaves the window as the only rule. Only
    terminal jobs are ever deleted, because deleting the fleet of a running job would kill it, so a
    project can stay over the threshold with every fleet still live.
  - |
    New ``scheduler_held_fleets`` metric, the fleets not yet deleted in each Code Engine project.
    A project holds at most 1000, so this is what an alert should watch. It is reported every
    scheduler loop, even while the cleanup is disabled.
upgrade:
  - |
    ``Job`` has two new fields, both read-only in the backoffice. ``finished_at`` is when the job
    reached a terminal status, which is what the retention window measures. ``fleet_deleted_at`` is
    set once Code Engine accepted the delete so it is not tried again. A fleet the delete keeps
    failing on is never stamped: after three attempts the scheduler stops picking it so it cannot
    block the queue, logs it at ERROR, and retries it after a restart. Migration ``0074`` adds both
    fields, gives the fleets we already hold a ``finished_at`` from their ``updated``, and adds a
    partial index on ``api_job`` for the retention scan.
  - |
    The delete resolves its Code Engine project from the job's own ``ce_project_name``, so a program
    reassigned to another project after a job ran still has its fleet deleted in the project that
    created it. An inactive project is included, because an offboarded project still holds fleets.
    A delete the project did not hold comes back as a 404, which Code Engine cannot tell from
    "already gone", so it is logged at WARNING naming the project: the fleet may still hold a slot
    somewhere else.
  - |
    The scheduler now keeps one circuit breaker per dependency per region, where it kept one per
    region. COS and Code Engine get their own, because a Fleets submit needs both while a cancel and
    a fleet delete need only Code Engine. The breaker answers whether that dependency is functional,
    so which operation made the call does not matter and all three record the outcome of every call
    they make. Which dependency answered does matter: a working delete no longer says COS is
    healthy, which used to clear the failures a throttling COS was building and stop the submit
    pause from ever firing. A cancel also no longer pauses while COS is unhappy, since it never
    touches it. Five consecutive failures that a later try can fix still open a breaker for a
    minute, and both numbers stay dynamic config: ``scheduler.fleets.breaker_failures`` and
    ``scheduler.fleets.breaker_pause_seconds``. ``FleetHandler.delete_job`` used to sleep 60 seconds
    on a 429 and retry forever, which would have blocked every other scheduler task for a minute.
    It now raises the 429 and the breaker waits it out.
