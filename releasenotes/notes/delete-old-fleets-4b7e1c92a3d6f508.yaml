---
features:
  - |
    The scheduler now deletes the Code Engine fleet of a terminal Fleets job once a retention
    window has passed, so a project does not reach its limit of 1000 fleets. The window keeps a
    fleet inspectable after the job finished, and it is two weeks. It is on from the first
    scheduler pod that boots, and because fleet deletion has never run before, the first cycles
    work through every fleet older than two weeks that we still hold. A deleted fleet cannot be
    recovered for Code Engine support, so size the backlog with ``scheduler_held_fleets`` first
    if that matters. Three things are dynamic config: ``scheduler.fleets.cleanup.enabled``, on
    by default, ``scheduler.fleets.cleanup.retention_hours``, 336 by default, and
    ``scheduler.fleets.cleanup.max_deletes_per_cycle``, 20 by default, which is also the delete
    rate against one project because the scheduler loop is about a second.
  - |
    A project close to its fleet limit does not wait out the two-week window. Once it holds
    ``scheduler.fleets.cleanup.force_at_percent`` of ``scheduler.fleets.quota_per_project``, 80%
    of 1000 by default, its oldest fleets are deleted until it is back under that number. A
    percentage outside 1 to 99 leaves the window as the only rule. Only terminal jobs are ever
    deleted, because deleting the fleet of a running job would kill it, and the runner refuses a
    non-terminal job whatever the caller asks. So a project can stay over the threshold with every
    fleet still live, and the scheduler logs that at ERROR. A job with no recorded project counts
    against no project, and only the window deletes it.
  - |
    New ``scheduler_held_fleets`` metric, the fleets not yet deleted in each Code Engine project.
    A project holds at most 1000, so this is what an alert should watch. A fleet we keep failing
    to delete stays in the count, so the number never hides a leak. It is reported every scheduler
    loop, and also while the feature is disabled, so the backlog can be sized before the deletion
    is turned off.
upgrade:
  - |
    ``Job`` has two new fields. ``finished_at`` is when the job reached a terminal status, which
    is what the retention window measures: ``updated`` moves on any later write, including the
    cleanup's own, so a window keyed on it would never expire. ``fleet_deleted_at`` is set once
    Code Engine accepted the delete so it is not tried again. Code Engine finishes the delete a
    minute or two later. A fleet the delete keeps failing on is never stamped: after three
    attempts the scheduler stops picking it so it cannot block the queue, logs it at ERROR, and
    retries it after a restart. It is read-only in the backoffice. Migration ``0074`` adds both,
    gives the fleets we already hold a ``finished_at`` from their ``updated``, and adds two
    partial indexes on ``api_job``, one for the retention scan and one for the per-project quota
    scan.
  - |
    The delete resolves its Code Engine project from the job's own ``ce_project_name``, so a
    program reassigned to another project after a job ran still has its fleet deleted in the
    project that created it. An inactive project is included, because an offboarded project still
    holds fleets, and an active row wins when two projects share a name. A delete the project did
    not hold comes back as a 404, which Code Engine cannot tell from "already gone", so it is
    logged at WARNING naming the project: the fleet may still hold a slot somewhere else.
  - |
    The scheduler now keeps one circuit breaker per dependency per region, where it kept one per
    region. COS and Code Engine get their own, because a Fleets submit needs both while a cancel
    and a fleet delete need only Code Engine. The breaker answers whether that dependency is
    functional, so which operation made the call does not matter and all three record the outcome
    of every call they make. Which dependency answered does matter: a working delete no longer
    says COS is healthy, which used to clear the failures a throttling COS was building and stop
    the submit pause from ever firing. A cancel also no longer pauses while COS is unhappy, since
    it never touches it. Five consecutive failures that a later try can fix still open a breaker
    for a minute, and both numbers stay dynamic config: ``scheduler.fleets.breaker_failures`` and
    ``scheduler.fleets.breaker_pause_seconds``.
  - |
    The cleanup waits out an unavailable Code Engine with that breaker instead of sleeping inside
    the scheduler loop. ``FleetHandler.delete_job`` used to sleep 60 seconds on a 429 and retry
    forever, which would have blocked every other scheduler task for a minute. It now raises the
    429 so the caller decides. A timeout or a 502 counts as a failure too, because a delete that
    may already have happened is free to repeat. A cleanup cycle records at most one failure per
    region, so a batch cannot open the breaker on its own.
