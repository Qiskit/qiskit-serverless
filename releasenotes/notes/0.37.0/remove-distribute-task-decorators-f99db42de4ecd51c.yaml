---
upgrade:
  - |
    The ``distribute_task`` decorator and the ``get``, ``put`` and
    ``get_refs_by_status`` helpers have been **removed**. They were deprecated in
    0.34.0 as thin wrappers around Ray's native API, which must now be used
    directly. Functions that need in-function parallelism should ``import ray``
    and use Ray's own decorators:

    * ``distribute_task`` -> `ray.remote <https://docs.ray.io/en/latest/ray-core/api/doc/ray.remote.html>`__
    * ``get`` -> `ray.get <https://docs.ray.io/en/latest/ray-core/api/doc/ray.get.html>`__
    * ``put`` -> `ray.put <https://docs.ray.io/en/latest/ray-core/api/doc/ray.put.html>`__
    * ``get_refs_by_status`` -> `ray.wait <https://docs.ray.io/en/latest/ray-core/api/doc/ray.wait.html>`__

    Before (using the removed Qiskit Serverless wrappers):

    .. code-block:: python

        from qiskit_serverless import get_arguments, save_result, distribute_task, get

        @distribute_task()
        def distributed_transpilation(circuit, target_backend):
            ...  # returns an ISA circuit
            return isa_circuit

        refs = [distributed_transpilation(circuit, backend) for circuit in circuits]
        isa_circuits = get(refs)
        save_result({"results": isa_circuits})

    After (using Ray directly):

    .. code-block:: python

        import ray
        from qiskit_serverless import get_arguments, save_result

        @ray.remote
        def distributed_transpilation(circuit, target_backend):
            ...  # returns an ISA circuit
            return isa_circuit

        refs = [distributed_transpilation.remote(circuit, backend) for circuit in circuits]
        isa_circuits = ray.get(refs)
        save_result({"results": isa_circuits})
  - |
    The ``distribute_qiskit_function`` decorator has been **removed**. It was
    deprecated in 0.30. Use the ``upload`` functionality of
    :class:`~qiskit_serverless.ServerlessClient` instead.
  - |
    ``qiskit_serverless.core.remote``, a thin proxy around `ray.remote
    <https://docs.ray.io/en/latest/ray-core/api/doc/ray.remote.html>`__, has
    been **removed**. Use ``ray.remote`` directly, as shown above.
  - |
    The OpenTelemetry spans that ``distribute_task`` injected around each
    distributed task have been removed along with it, including the per-task
    ``qs.meta.*``, ``qs.resources.*``, ``qs.args.*`` and ``qs.kwargs.*`` span
    attributes. The client-side ``job.*``, ``function.*`` and ``files.*`` spans,
    and gateway and scheduler tracing, are unaffected.
