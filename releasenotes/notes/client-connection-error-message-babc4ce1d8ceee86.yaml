---
fixes:
  - |
    A request that fails to reach the service because the connection was dropped,
    the TLS handshake failed, or the request timed out now raises a
    ``QiskitServerlessException`` with code ``CONN1001`` and a message saying the
    failure is usually temporary and to try again. These transient failures were
    previously reported with code ``AUTH1001`` and a message telling the user to
    check their host and authentication, which pointed at configuration that was
    not the problem.
