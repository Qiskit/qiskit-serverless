---
security:
  - |
    A function's ``arguments_schema`` can no longer make the gateway fetch external resources. The schema is supplied
    by whoever uploads the function and was evaluated with ``jsonschema``'s default reference resolution, which
    retrieves ``$ref`` targets on use. A schema such as ``{"$ref": "http://<internal-host>/path"}`` therefore made the
    gateway issue an outbound request from inside the cluster on every run of that function, and a ``file://``
    reference read a file from the gateway container. Part of the retrieved content was reflected back in the ``400``
    response, and a reference that never answered occupied a worker with no timeout.

    Schemas are now validated with an empty reference registry, so nothing is ever retrieved, and external references
    are rejected at upload time with a ``400`` explaining that definitions must be inlined or use an internal
    reference such as ``#/$defs/name``. Same-document references keep working. Existing stored schemas that contain an
    external reference now fail validation with a clear ``400`` instead of triggering a request.
fixes:
  - |
    A stored ``arguments_schema`` that is valid JSON but not a valid JSON Schema (for example a typo like
    ``{"type": "integar"}``) no longer returns ``500 Internal server error`` on every run of the function. Such a
    schema is rejected at upload time, and if one is already stored it is reported as a ``400`` naming the problem.
