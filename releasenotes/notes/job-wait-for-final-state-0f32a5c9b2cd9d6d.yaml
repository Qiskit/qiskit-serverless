---
features:
  - |
    Added :meth:`~qiskit_serverless.core.job.Job.wait_for_final_state`, which
    waits until a job is ``DONE``, ``ERROR`` or ``CANCELED`` and returns that
    status::

        job.wait_for_final_state(timeout=600)
        # 'DONE'

    It checks the status after 1, 2, 4, 8 and 16 seconds, then every 30
    seconds, and starts again from 1 second when the main status changes or the
    job enters post-processing. So a short job is seen within seconds, and a
    long job makes fewer requests than a loop that checks every few seconds. If
    the status does not change for a while, the end can be seen up to about 30
    seconds late. ``poll_interval`` sets a fixed interval instead, of at least
    1 second.

    A ``timeout`` raises ``TimeoutError`` and never cancels the job. Short
    network errors and ``429``, ``502``, ``503`` or ``504`` answers are retried
    at the same pace, until the timeout, or for up to 5 minutes in a row when
    there is no timeout. Any other error, or one that lasts that long, is
    raised. ``verbose=True`` prints one line per status change and per retried
    error, and the error message if the job ends in ``ERROR``.
  - |
    :meth:`~qiskit_serverless.core.job.Job.status` now asks the service only
    until the job reaches ``DONE``, ``ERROR`` or ``CANCELED``, and then returns
    that status without a request, because a final status cannot change. So
    calling :meth:`~qiskit_serverless.core.job.Job.result` or
    :meth:`~qiskit_serverless.core.job.Job.error_message` on a finished job no
    longer sends the same status request again and again.
