---
fixes:
  - |
    The gateway now reads the w3id SSO credentials from ``W3ID_SSO_CREDENTIALS``, the ``key_all`` JSON
    of the synced Secret, so it can start with ``application.w3idSso.enabled`` on. It replaces
    ``W3ID_SSO_CLIENT_ID`` and ``W3ID_SSO_CLIENT_SECRET``. The deployment takes the Secret name from
    ``secrets.w3idSso.name``.
