---
features:
  - |
    Qiskit Functions can now declare the arguments they accept as a JSON Schema, and the gateway validates submitted
    arguments against it before any compute is used. Previously a function given bad input failed mid-execution, after
    the user had already waited through queue time and container startup.

    Attach the schema when uploading a function through the ``arguments_schema`` field of ``QiskitFunction``::

        function = QiskitFunction(
            title="my-function",
            entrypoint="main.py",
            working_dir="./src",
            arguments_schema={
                "type": "object",
                "required": ["shots"],
                "properties": {"shots": {"type": "integer"}},
            },
        )
        runnable = client.upload(function)

    From then on, running that function with arguments that do not match the schema is rejected with a ``400`` before
    the job is created, so no job is queued and no partial rows are left behind. The error names the keyword that
    failed, what the schema asked for, and the value that was rejected, and ``path`` points at the offending field::

        {
          "message": "'type' validation failed, schema requires 'integer': rejected value 'wrong-type'",
          "path": ["shots"]
        }

    The feature is opt-in and backwards compatible: functions without a schema are never validated.

    Re-uploading a function without the field keeps the schema it already had, so a schema is removed by uploading an
    empty one::

        function.arguments_schema = {}
        client.upload(function)
  - |
    Two things to know when writing a schema. First, the schema is applied to the arguments **as the SDK encodes them**,
    not as they look in Python, so a ``QuantumCircuit`` arrives as ``{"__type__": "QuantumCircuit", "__value__":
    "<base64 QPY>"}`` and a numpy array as an object rather than an array. Describing a circuit or an array argument
    with ``{"type": "array"}`` therefore rejects every legitimate call. The advice is to constrain the plain arguments
    (counts, names, options, flags) and to check only the ``__type__`` tag of the Qiskit ones.

    Second, a declared schema brings size limits with it: the schema itself may be at most 64 KB and is turned down at
    upload time when it is larger, may not nest deeper than 64 levels or hold more than 200 subschemas, and the encoded
    arguments of a function that declares a schema may be at most 1 MB. Evaluating a schema is also bounded in CPU time
    and memory, so a schema that is too expensive to evaluate comes back as a ``400`` naming the limit it hit rather
    than as a server error. Functions without a schema are unaffected by all of this.

    Both are written up in full in ``specs/ARGUMENTS_VALIDATION.md``.
  - |
    New endpoint ``POST /api/v1/programs/validate_arguments/`` checks arguments against a function's schema without
    submitting a run, so inputs can be verified before paying for a job. It resolves the function with the same
    permission rules as ``/run`` and returns ``200 {"valid": true}`` or a ``400`` describing the problem.

    From the client SDK::

        runnable.validate_arguments({"shots": 1024})

    Invalid arguments raise ``QiskitServerlessException``.
  - |
    Functions read back with ``client.function(...)`` or ``client.functions()`` now include ``arguments_schema``, so the
    arguments a function expects can be inspected even by callers who did not upload it.
upgrade:
  - |
    ``QiskitFunction.schema`` has been renamed to ``arguments_schema`` and its type changed from ``Optional[str]`` to
    ``Optional[Union[Dict[str, Any], bool]]``. The old field was never read by the client nor sent to the gateway, so
    there is no deprecation path. Pass a plain dict rather than a JSON string. A boolean is accepted because ``true``
    and ``false`` are valid JSON Schemas in their own right, accepting and rejecting every argument respectively.
  - |
    The unused ``validate`` field has been removed from ``QiskitFunction``. It gated a client-side validation hook that
    was never implemented and always reported success, so passing ``validate=False`` had no effect. Argument validation
    now happens on the gateway against ``arguments_schema``.
