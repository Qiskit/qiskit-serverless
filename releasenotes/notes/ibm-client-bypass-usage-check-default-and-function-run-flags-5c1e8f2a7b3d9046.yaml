---
upgrade:
  - |
    :meth:`.IBMServerlessClient.run` now skips the client-side runtime quota check by default:
    ``bypass_usage_check`` defaults to ``True``. The gateway still enforces its own quota checks.
    Pass ``bypass_usage_check=False`` to run the client-side check before submitting. The warning
    previously emitted when the check was bypassed has been removed, so ``suppress_usage_warning``
    now only silences the low-quota warning of the client-side check.
  - |
    :meth:`.RunnableQiskitFunction.run` no longer sends ``bypass_usage_check``,
    ``suppress_usage_warning`` or ``show_kwargs_split`` to the function as arguments. A function
    that reads an argument with one of these names no longer receives it.
fixes:
  - |
    :meth:`.RunnableQiskitFunction.run` now forwards ``bypass_usage_check`` and
    ``suppress_usage_warning`` to the client. Before, ``my_function.run(bypass_usage_check=True)``
    sent the flag to the function as an argument and the usage check still ran. With a client whose
    ``run`` does not accept a flag, such as a plain :class:`.ServerlessClient`, the flag is dropped
    with a warning.
features:
  - |
    :meth:`.RunnableQiskitFunction.run` accepts ``show_kwargs_split=True``, which emits a warning
    showing how the keyword arguments were split into function arguments (by name only),
    forwarded client options and ignored client options.
