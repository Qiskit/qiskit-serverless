---
features:
  - |
    ``BackgroundExecutor.submit`` accepts an optional ``replace_key``: a task
    that is still waiting with the same key in the same pool is replaced by the
    new one, which takes its place in the queue and needs no new slot. There is
    a new outcome ``replaced`` in ``background_executor_tasks_total``, and
    ``BackgroundExecutor.would_accept`` tells whether a ``submit`` would be
    accepted. The outcome ``skipped`` of that metric is now called ``canceled``.
