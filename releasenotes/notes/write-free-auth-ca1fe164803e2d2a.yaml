---
fixes:
  - |
    Authentication now writes only the user's groups that changed, so a
    request whose groups did not change makes no database write. This also
    removes a short window in which a parallel request from the same user
    could see no groups.
  - |
    ``GET /api/v1/jobs/{id}/`` now reads the job, its program, its provider
    and its compute profile in one database query.
  - |
    The authentication errors that asked users to try again later, where
    retrying cannot help, no longer ask them to retry. They now say what to
    check, or to contact IBM support.
