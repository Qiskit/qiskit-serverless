name: Gateway verify process

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify-gateway:
    name: Verify gateway [lint, test, coverage]

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # keep running if one leg fails
      matrix:
        python-version:
          - '3.12'

    defaults:
      run:
        working-directory: ./gateway

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Set up tox environment
        run: |
          pver=${{ matrix.python-version }}
          tox_env="-epy${pver/./}"
          echo tox_env
          echo TOX_ENV=$tox_env >> $GITHUB_ENV
      - name: Install tox
        run: |
          pip install tox>=4.0.0
      - name: Check migrations
        id: migrations
        run: tox -emigrations
      - name: Explain how to fix the migrations
        if: failure() && steps.migrations.outcome == 'failure'
        run: |
          echo "::error title=Migrations out of sync::Either two migrations share the same parent (usually because another PR merged a migration first) or a model change has no migration. For a conflict, rename your migration with the next free number, point its dependency at the latest migration on main, then run 'tox -emigrations' again. The /fix-migrations skill does it for you."
      - name: Run styles check
        run: tox -elint
      - name: Test using tox environment
        run: |
          tox ${{ env.TOX_ENV }}
      - name: Coverage check
        run: |
          tox -ecoverage
