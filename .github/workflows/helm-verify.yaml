name: Helm verify process

on:
  push:
    paths:
      - "ct.yaml"
      - "charts/**"
      - ".github/actions/helm-lint/action.yaml"
      - ".github/workflows/helm-verify.yaml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan helm
        uses: ./.github/actions/helm-lint
