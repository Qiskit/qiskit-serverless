# compose config for fleets integration tests (mock CE + MinIO)
x-gateway-env: &gateway-env
  DEBUG: "1"
  SETTINGS_AUTH_MECHANISM: mock_token
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: serverlessdb
  DATABASE_USER: serverlessuser
  DATABASE_PASSWORD: serverlesspassword
  FLEETS_MOCK_ENABLED: "1"
  MINIO_ENDPOINT: http://minio:9000
  # Host-relative: only valid for presigned URLs handed back to the host-side
  # pytest client (where 127.0.0.1:9000 is the published MinIO port). The
  # gateway itself must never fetch this — internal access uses MINIO_ENDPOINT.
  MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  IBM_CLOUD_API_KEY: fake-api-key-for-test
  CE_HMAC_SECRET_NAME: cos-hmac-secret
  LIMITS_MAX_FLEETS: "10"
  FLEETS_DEFAULT_IMAGE: python:3.12-slim
  DEFAULT_COMPUTE_PROFILE: 16x128
  CE_DEFAULT_PROJECT_NAME: test-project
  CE_PROJECTS: '[{"project_id":"test-project-id","project_name":"test-project","region":"us-south","resource_group_id":"test-rg-id","subnet_pool_id":"test-subnet-pool-id","pds_name_state":"test-pds-state","pds_name_users":"test-pds-users","pds_name_providers":"test-pds-providers","cos_instance_name":"test-cos-instance","cos_key_name":"test-cos-key","cos_bucket_task_store_name":"task-store-bucket","cos_bucket_user_data_name":"user-data-bucket","cos_bucket_provider_data_name":"provider-data-bucket"},{"project_id":"test-provider-project-id","project_name":"test-provider-project","region":"us-south","resource_group_id":"test-rg-id","subnet_pool_id":"test-subnet-pool-id","pds_name_state":"test-pds-state","pds_name_users":"test-pds-users","pds_name_providers":"test-pds-providers","cos_instance_name":"test-cos-instance","cos_key_name":"test-cos-key","cos_bucket_task_store_name":"task-store-bucket","cos_bucket_user_data_name":"user-data-bucket","cos_bucket_provider_data_name":"provider-data-bucket"}]'
  CE_COS_USE_PUBLIC_ENDPOINT: "true"
  FLEETS_GATEWAY_HOST: http://gateway:8000
  # Explicit opt-out of OTEL span export (default is "0" — set for clarity).
  OTEL_ENABLED: "0"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: serverlessdb
      POSTGRES_USER: serverlessuser
      POSTGRES_PASSWORD: serverlesspassword
    networks:
      - safe-tier
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U serverlessuser -d serverlessdb"]
      interval: 1s
      timeout: 5s
      retries: 5
      # First-time init takes about 1.5s native and 6.5s emulated, and the arm64 overrides run
      # postgres under emulation. Without a start_period, retries x interval marks it unhealthy at
      # ~9s and compose aborts the whole stack rather than waiting for it to recover.
      start_period: 30s
  # S3-compatible object store for the fleets tests. Formerly MinIO (EOL Feb
  # 2026, removed from Docker Hub); now SeaweedFS's S3 gateway. The service is
  # still named "minio" and still serves on :9000 so MINIO_ENDPOINT,
  # MINIO_PUBLIC_ENDPOINT and every depends_on keep working unchanged — the code
  # only ever spoke plain S3 (boto3 / ibm_boto3), never the MinIO SDK.
  #
  # NB: LocalStack's free s3-latest image was discontinued (2026-03-23) and now
  # refuses to start, pointing at the paid Pro image — unusable for public CI.
  # SeaweedFS is Apache-2.0, a single binary, and its `server -s3` mode accepts
  # any credentials, so the historical minioadmin/minioadmin values still work.
  minio:
    image: chrislusf/seaweedfs:latest
    # Run master + volume + filer + S3 gateway in one process; pin the S3 API to
    # :9000 to preserve the endpoint contract above.
    command: server -s3 -s3.port=9000 -dir=/data
    networks:
      - safe-tier
    ports:
      - 9000:9000
    healthcheck:
      # The S3 gateway serves HTTP 200 on /status once it is ready.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
  minio-init:
    # Bucket bootstrap, formerly the MinIO `mc` CLI. SeaweedFS ships no S3
    # client, so use the official awscli image with `s3api create-bucket`.
    # Idempotent: re-creating an existing bucket errors, which we swallow so
    # re-runs stay green.
    image: amazon/aws-cli:2.31.15
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      for b in user-data-bucket provider-data-bucket task-store-bucket fleet-state fleet-state-archive; do
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket \"$$b\" 2>/dev/null || true;
      done &&
      echo 'Buckets created successfully'
      "
    networks:
      - safe-tier
  gateway:
    container_name: gateway
    build:
      context: ./
      dockerfile: gateway/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - 8000:8000
    user: "root" # root user is needed to write on volumes and sync files from local system (see the watch: section)
    environment:
      <<: *gateway-env
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: "123"
      DJANGO_SUPERUSER_EMAIL: admin@noemail.com
      SITE_HOST: http://gateway:8000
    networks:
      - safe-tier
    volumes:
      - media-data:/usr/src/app/media/
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    develop:
      watch: &gateway-watch
        - path: ./gateway
          action: sync
          target: /usr/src/app
  scheduler:
    user: "root" # root user is needed to write on volumes
    container_name: scheduler
    build:
      context: ./
      dockerfile: gateway/Dockerfile
    # Skip sync_ce_project here — the gateway entrypoint already creates the
    # CodeEngineProject row.  Running it from both services races and can
    # produce duplicate rows (MultipleObjectsReturned on the next call).
    entrypoint: ["/bin/sh", "-c", "python manage.py migrate_with_lock && exec python manage.py run_scheduler"]
    environment:
      <<: *gateway-env
    networks:
      - safe-tier
    volumes:
      - media-data:/usr/src/app/media/
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # The scheduler runs the same code and drives status transitions, so it must
    # live-sync too; otherwise `docker compose watch` updates the gateway while
    # the scheduler keeps running stale code.
    develop:
      watch: *gateway-watch
  fleet-worker:
    container_name: fleet-worker
    build:
      context: ./
      dockerfile: tests/fleets/fleet-worker/Dockerfile
      # Built FROM the fleets runtime base. Build it first:
      #   make build-fleet-node   (tags fleet-node:latest)
      args:
        BASE_IMAGE: ${FLEET_NODE_IMAGE:-fleet-node:latest}
    privileged: true
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - FLEET_STATE_BUCKET=fleet-state
      - TASK_STORE_BUCKET=task-store-bucket
      - USER_DATA_BUCKET=user-data-bucket
      - PROVIDER_DATA_BUCKET=provider-data-bucket
      - FLEET_WORKER_STARTUP_DELAY_SEC=2
    networks:
      - safe-tier
    depends_on:
      minio-init:
        condition: service_completed_successfully
networks:
  safe-tier:
volumes:
  media-data:
